services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - INDEX_PATH=/data/hnsw_index.bin
      - MAPPING_PATH=/data/id_mapping.json
      - TESTING_MODE=true
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
    networks:
      - orchara-network
    volumes:
      - orchara-database_index-data:/data
      - ./app:/app/app
      - ./tests:/app/tests
      - ./main.py:/app/main.py
      - ./requirements.txt:/app/requirements.txt
      - ./.env:/app/.env

networks:
  orchara-network:
    external: true
    name: orchara-database_default

volumes:
  orchara-database_index-data:
    external: true 